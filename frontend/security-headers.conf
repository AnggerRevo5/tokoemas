# Header keamanan untuk halaman aplikasi (hasil build Vite). Di-include pada setiap location yang
# menyajikan file statis, karena add_header di dalam location menimpa add_header di level server.
# CSP: script hanya dari origin sendiri; font dari Google Fonts (dipakai index.html);
# style 'unsafe-inline' dibutuhkan untuk atribut style yang dipasang React/animasi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HTTPS diakhiri di Cloudflare; browser hanya menerima HSTS lewat HTTPS
add_header Strict-Transport-Security "max-age=31536000" always;
