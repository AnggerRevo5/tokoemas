server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # jangan tampilkan versi nginx di header atau halaman error
    server_tokens off;

    # sama dengan batas body di backend (1 MB) ditambah sedikit ruang
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    location = /api {
        return 308 /api/;
    }

    # API: header keamanan dipasang oleh backend Go
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # file hasil build bernama hash, aman di-cache lama
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # tolak file tersembunyi dan source map bila ada yang terselip
    location ~ /\.|\.map$ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
