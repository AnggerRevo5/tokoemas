services:
  # Database memakai container MariaDB yang sudah ada di server (dikelola lewat phpMyAdmin),
  # bukan database bawaan compose ini. Backend tersambung lewat jaringan DB_NETWORK.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_DSN: "app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@tcp(${DB_HOST:-mariadb}:3306)/toko_emas?parseTime=true&loc=Asia%2FJakarta&time_zone=%27%2B07%3A00%27"
    expose:
      - "8080"
    # default: untuk dihubungi frontend; db-net: untuk menjangkau MariaDB.
    networks:
      default:
      db-net:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    # default: untuk menghubungi backend; private-net: supaya cloudflared bisa menjangkau frontend.
    # Backend dan database tidak ikut ke private-net.
    networks:
      default:
      private-net:
        aliases:
          - tokoemas-frontend

networks:
  private-net:
    external: true
  db-net:
    external: true
    name: ${DB_NETWORK:-db-net}
